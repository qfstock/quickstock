<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f9">
<title>장전 체크리스트</title>
<link rel="apple-touch-icon" href="./Stock.png">
<link rel="stylesheet" href="style.css?v=12">
<script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><i></i><div><b>장전 체크리스트</b><small>PRE-MARKET CHECKLIST</small></div></div>
  <div class="tools"><span id="updated">데이터 확인 전</span><button id="refresh" aria-label="새로고침" title="데이터 새로고침">↻</button></div>
</header>
<main>
  <section class="intro card">
    <div><span class="eyebrow">MARKET OVERVIEW</span><h1>오늘 장 시작 전, 시장 한눈에 보기</h1></div>
    <div class="intro-meta"><span class="live-dot"></span><span id="status">데이터 연결 준비 중</span></div>
  </section>
  <section class="summary card">
    <div class="section-heading"><div><span class="eyebrow">QUICK CHECK</span><h2>장전 요약</h2></div><small>종가 · 등락 · 등락률</small></div>
    <div id="summaryRows" class="summary-rows"></div>
  </section>
  <div class="section-heading chart-section-heading"><div><span class="eyebrow">120-BAR CHARTS</span><h2>시장별 차트</h2></div><small>최근 120개 일봉 · 아래로 스크롤</small></div>
  <section id="charts" class="charts"></section>
  <footer>자료는 외부 시세 제공처 기준이며, 거래소·상품별 업데이트 시점이 다를 수 있습니다. 투자 판단 전 원자료를 확인하세요.</footer>
</main>
</div>
<script src="app.js?v=111"></script>
</body>
</html>
